# Windows 실행파일을 만들고 **릴리스에 올립니다.**
#
# electron-builder 가 릴리스 생성과 업로드까지 합니다 (`--publish always`).
# 그래야 설치본(.exe) 과 함께 `latest.yml` 이 올라가는데, 앱의 자동 업데이트가
# 새 버전이 있는지 확인할 때 보는 파일이 바로 그것입니다.
# .exe 만 손으로 올리면 **업데이트가 영영 안 걸립니다.**
#
# 이 저장소가 공개인 이유: 앱이 토큰 없이 릴리스를 읽어야 하기 때문입니다.
# 비공개 저장소에서 받으려면 토큰을 앱 안에 넣어야 하는데, 그러면 설치본을 가진
# 사람이 토큰을 꺼내 소스를 읽을 수 있습니다. 그래서 **껍데기만** 여기 두고
# 업무 로직·데이터는 비공개 저장소에 남겨뒀습니다.
name: 릴리스 (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # 버전은 package.json 의 version 을 씁니다. 올리는 것을 잊으면
      # 같은 버전으로 릴리스를 덮어쓰게 되고, 이미 설치된 앱은 업데이트를 못 봅니다.
      #
      # ⚠️ 태그를 **먼저** 만들어야 합니다. electron-builder 는 곧바로 공개 릴리스를
      #    만드는데(releaseType: release), GitHub 는 공개 릴리스에 실재하는 태그를
      #    요구합니다 — 없으면 `422 Published releases must have a valid tag` 입니다.
      #    (2026-08-27 첫 릴리스에서 실제로 이 오류를 냈습니다.)
      - name: 버전 확인 + 태그 만들기
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          echo "빌드 버전: $v"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "::warning::v$v 릴리스가 이미 있습니다. package.json 의 version 을 올리세요."
          fi
          if git ls-remote --exit-code --tags origin "v$v" >/dev/null 2>&1; then
            echo "태그 v$v 가 이미 있습니다."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "v$v"
            git push origin "v$v"
          fi
          # 릴리스도 **여기서 미리** 만듭니다.
          #
          # electron-builder 는 파일마다(.exe, .blockmap) 업로더를 띄우는데, 릴리스가
          # 없으면 **둘이 동시에 만들려고 달려듭니다.** 2026-08-27 첫 시도에서 한쪽은
          # 만들고 한쪽은 422 로 죽어서, .exe 와 latest.yml 이 빠진 **반쪽 릴리스**가
          # 남았습니다 (blockmap 만 올라감). 미리 만들어 두면 둘 다 「올리기」만 합니다.
          if ! gh release view "v$v" >/dev/null 2>&1; then
            printf '%s\n' \
              "다올로직스 통합 관리 시스템 데스크톱 앱 (Windows)." \
              "" \
              "\`DaolLogics-Setup-*.exe\` 를 받아 실행하면 설치됩니다." \
              "처음 실행 시 SmartScreen 경고가 나오면 「추가 정보」 → 「실행」 을 누르세요" \
              "(사내 배포라 코드 서명을 하지 않습니다)." \
              "" \
              "v1.1.0 이상부터 **자동 업데이트**가 들어갑니다 — 앞으로는 앱이 알아서 받습니다." \
              > notes.md
            gh release create "v$v" --title "다올로직스 데스크톱 v$v" --notes-file notes.md
            rm -f notes.md
          fi

      - name: 빌드 + 릴리스 업로드
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: DaolLogics-Setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
